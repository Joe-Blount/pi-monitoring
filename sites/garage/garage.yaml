# Garage: one sensor, no control. Raspberry Pi 4, Raspbian 11.

site: garage
node: garage
measurement: garage
tags:
  node: garage

devices:

  # The DHT22 deliberately stays on its existing compiled telegraf plugin for
  # now. It works, and replacing it would mean adopting a GPIO library this
  # project does not trust yet. Swapping the one thing that works for the one
  # library we distrust is a poor first move; this comes later, or never.
  #
  # - name: box
  #   driver: dht
  #   mode: poll
  #   interval: 30s
  #   tags: {location: box}
  #   params: {model: DHT22, pin: 4, retries: 3}

  - name: host
    driver: host
    mode: poll
    interval: 30s
    tags: {location: pi}

  # The two SOK rack packs, read over Bluetooth. These are the version without
  # a wired communication port, so Bluetooth is the only way in.
  #
  # Each needs its own address, which is not knowable from here. On the Pi:
  #
  #     bluetoothctl scan on
  #
  # and watch for the names the packs advertise. Then put each address below
  # and confirm with `collect --check`.
  #
  # Polled slowly and staggered on purpose. A pack accepts one connection at a
  # time, so a reading locks the phone application out for as long as it runs,
  # and two readers starting together contend for the one radio on the Pi.
  #
  # Declared and disabled rather than commented out, which is this project's
  # own rule and matters more here than usual: the battery heating block below
  # names these devices, and a name that resolves to nothing produces a load
  # that never runs with nothing reporting why.
  #
  # On site: run bin/ble-discover --scan, put the real addresses in, and set
  # enabled: true. One word each rather than re-indenting a block in a garage.
  - name: pack1
    driver: abc_bms
    mode: poll
    enabled: false
    tags: {location: rack}
    params: {address: "XX:XX:XX:XX:XX:XX"}

  - name: pack2
    driver: abc_bms
    mode: poll
    enabled: false
    tags: {location: rack}
    params: {address: "YY:YY:YY:YY:YY:YY"}

  # The EG4, waiting on one cable: a USB-to-RS232 adapter with a DB9 male end,
  # which mates with the RJ45-to-DB9 cable that came with the inverter. That
  # goes into the jack printed RS232 or COM.
  #
  # NOT the jack printed RS485, which is the battery channel where the
  # inverter is the master and never answers a query. Not the USB-B port
  # either, which is documented as unusable for monitoring on this model.
  # Both were tried.
  #
  # Measure before plugging anything in: black lead on DB9 pin 5, then read
  # pins 2 and 3. Whichever is negative is the inverter's transmit pin. Pin 2
  # means plug straight in; pin 3 means insert the null modem.
  #
  # On site: put the real by-id path in and set enabled: true. If the first
  # read fails its checksum, this firmware computes it differently from the
  # specification; set verify_reply_crc: false rather than assuming the
  # wiring is wrong.
  - name: inverter
    driver: pi30
    mode: poll
    enabled: false
    tags: {location: inverter}
    params:
      port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXXXXXX-if00-port0
      baud: 2400
      queries: [QPIGS, QMOD]

# Battery heating. These SOK rack packs have no heater of their own and cannot
# be charged below freezing, so a cold sunny morning is refused until the day
# warms up on its own.
#
# What exists today is plumbing heat tape on a switched outlet behind a
# low-voltage disconnect, which heats whenever something is charging. It works.
# This replaces the trigger, not the heater: heat when the packs are actually
# cold enough to be the thing standing in the way, and only when the sun can
# pay for it.
#
# Leave control disabled until the relay is wired and the probe reads. Turning
# it on with no heater attached does nothing useful and makes the dashboard
# claim a load exists.
control:
  enabled: false
  state_file: /var/lib/monitoring/garage-control.json
  loop_interval: 30s
  publish_as:
    location: control

  loads:

    battery_heating:
      type: battery_heating
      enabled: false
      control_pin: 24
      polarity: energize_to_connect   # a dead Pi must not leave a heater on

      # Falls back rather than refusing. Heating without a temperature is just
      # the existing dumb heater, which has run for seasons, and the snap-disc
      # cutout in series bounds it. Refusing would let a flaky radio cost a
      # whole winter of charging.
      on_stale_data: fallback

      temperature:
        # The packs' own sensors, about two per pack. They sit against the
        # cells rather than on a case, and they need no wiring.
        #
        # The exact field names wait on finding the temperature offsets in the
        # ABC-BMS reply, which is a --raw job on site. Until then this load
        # stays disabled.
        sources:
          - {device: pack1, field: temp_1}
          - {device: pack1, field: temp_2}
          - {device: pack2, field: temp_1}
          - {device: pack2, field: temp_2}

        # No ambient fallback on this node. The garage DHT22 deliberately
        # stays on its old compiled telegraf plugin, so this software does not
        # read it, and naming it here would be a source that never resolves.
        # With no fallback, a stale pack reading degrades to heating on
        # production alone, which is what the existing dumb heater does.
        fallback_sources: []

        max_disagreement_f: 15
        stale_after: 10m

      heat_if_all:
        coldest_below_f: 41.0         # 5 C
      stop_if_any:
        coldest_above_f: 50.0         # 10 C
        any_sensor_above_f: 104.0     # 40 C hard stop
      heat_dwell: 5m
      stop_dwell: 5m
      min_off: 15m

      # The EG4 is the only source of production here, so this waits on the
      # serial adapter. Until then the heating stays disabled rather than
      # running on a guess about the weather.
      require_production:
        enabled: true
        # Panel voltage, not watts. A cold pack makes the BMS refuse charge,
        # the EG4 curtails, and watts fall to the house load. A watts gate
        # would read low on the cold clear morning this exists for. Panel
        # voltage is set by the sun and cannot be suppressed by the battery.
        source: {device: inverter, field: pv_volts}
        above_volts: 80
        stale_after: 10m

      limits:
        max_run_per_day: 6h
        cooldown: 15m

      readback:
        source: none
        pin: null
