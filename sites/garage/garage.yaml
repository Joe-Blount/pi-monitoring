# Garage: one sensor, no control. Raspberry Pi 4, Raspbian 11.

site: garage
node: garage
measurement: garage
tags:
  node: garage

devices:

  # The DHT22 deliberately stays on its existing compiled telegraf plugin for
  # now. It works, and replacing it would mean adopting a GPIO library this
  # project does not trust yet. Swapping the one thing that works for the one
  # library we distrust is a poor first move; this comes later, or never.
  #
  # - name: box
  #   driver: dht
  #   mode: poll
  #   interval: 30s
  #   tags: {location: box}
  #   params: {model: DHT22, pin: 4, retries: 3}

  - name: host
    driver: host
    mode: poll
    interval: 30s
    tags: {location: pi}

  # The two SOK rack packs, read over Bluetooth. These are the version without
  # a wired communication port, so Bluetooth is the only way in.
  #
  # Each needs its own address, which is not knowable from here. On the Pi:
  #
  #     bluetoothctl scan on
  #
  # and watch for the names the packs advertise. Then put each address below
  # and confirm with `collect --check`.
  #
  # Polled slowly and staggered on purpose. A pack accepts one connection at a
  # time, so a reading locks the phone application out for as long as it runs,
  # and two readers starting together contend for the one radio on the Pi.
  #
  # - name: pack1
  #   driver: abc_bms
  #   mode: poll
  #   interval: 300s
  #   tags: {location: rack}
  #   params: {address: "XX:XX:XX:XX:XX:XX"}
  #
  # - name: pack2
  #   driver: abc_bms
  #   mode: poll
  #   interval: 300s
  #   tags: {location: rack}
  #   params: {address: "YY:YY:YY:YY:YY:YY"}

# The EG4 inverter is waiting on one cable: a USB-to-RS232 adapter with a DB9
# male end, which mates with the RJ45-to-DB9 cable that came with the inverter.
# That goes into the jack printed RS232 or COM.
#
# NOT the jack printed RS485, which is the battery channel where the inverter
# is the master and never answers a query. Not the USB-B port either, which is
# documented as unusable for monitoring on this model. Both were tried.
#
# Uncomment when the adapter arrives. If the first read fails its checksum,
# this firmware computes it differently from the specification; set
# verify_reply_crc: false rather than assuming the wiring is wrong.
#
# - name: inverter
#   driver: pi30
#   mode: poll
#   interval: 30s
#   tags: {location: inverter}
#   params:
#     port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_XXXXXXXX-if00-port0
#     baud: 2400
#     queries: [QPIGS, QMOD]

# Battery heating. These SOK rack packs have no heater of their own and cannot
# be charged below freezing, so a cold sunny morning is refused until the day
# warms up on its own.
#
# What exists today is plumbing heat tape on a switched outlet behind a
# low-voltage disconnect, which heats whenever something is charging. It works.
# This replaces the trigger, not the heater: heat when the packs are actually
# cold enough to be the thing standing in the way, and only when the sun can
# pay for it.
#
# Leave control disabled until the relay is wired and the probe reads. Turning
# it on with no heater attached does nothing useful and makes the dashboard
# claim a load exists.
control:
  enabled: false
  state_file: /var/lib/monitoring/garage-control.json
  loop_interval: 30s
  publish_as:
    location: control

  loads:

    battery_heating:
      type: battery_heating
      enabled: false
      control_pin: 24
      polarity: energize_to_connect   # a dead Pi must not leave a heater on

      # Falls back rather than refusing. Heating without a temperature is just
      # the existing dumb heater, which has run for seasons, and the snap-disc
      # cutout in series bounds it. Refusing would let a flaky radio cost a
      # whole winter of charging.
      on_stale_data: fallback

      temperature:
        # The packs' own sensors, about two per pack. They sit against the
        # cells rather than on a case, and they need no wiring.
        #
        # The exact field names wait on finding the temperature offsets in the
        # ABC-BMS reply, which is a --raw job on site. Until then this load
        # stays disabled.
        sources:
          - {device: pack1, field: temperature_1_f}
          - {device: pack1, field: temperature_2_f}
          - {device: pack2, field: temperature_1_f}
          - {device: pack2, field: temperature_2_f}

        # The existing DHT22 in the box. Not pack temperature, but a cold room
        # means cold packs, and a better guess than ignoring the weather.
        fallback_sources:
          - {device: box, field: temperature_f}

        max_disagreement_f: 15
        stale_after: 10m

      heat_if_all:
        coldest_below_f: 41.0         # 5 C
      stop_if_any:
        coldest_above_f: 50.0         # 10 C
        any_sensor_above_f: 104.0     # 40 C hard stop
      heat_dwell: 5m
      stop_dwell: 5m
      min_off: 15m

      # The EG4 is the only source of production here, so this waits on the
      # serial adapter. Until then the heating stays disabled rather than
      # running on a guess about the weather.
      require_production:
        enabled: true
        source: {device: inverter, field: pv_watts}
        above_watts: 300
        stale_after: 10m

      limits:
        max_run_per_day: 6h
        cooldown: 15m

      readback:
        source: none
        pin: null
