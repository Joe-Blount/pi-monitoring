# Reference node file. Every option this project understands appears here,
# with the reasoning for the ones that are not obvious.
#
# One file describes one MACHINE, not one site. A site can have several
# machines: the deer blind is planned as an upstairs node holding the sensors
# and a downstairs node holding the power devices and the load control. Both
# write the same measurement, so dashboards do not care how the work is split.
#
# Copy this file, delete what does not apply, and keep the comments that
# explain a local decision.


# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

site: example                 # the physical place
node: example                 # the machine within that place
measurement: example          # InfluxDB measurement for everything this node
                              # writes. Keep it stable: changing it breaks
                              # every existing dashboard.

tags:
  # A tag naming the device is added automatically to every device, so two
  # devices sharing a location cannot write into one series. Set `device`
  # explicitly on a device only to choose a different series name.
  node: example               # REQUIRED when a site has more than one machine.
                              # Every Pi here is named raspberrypi and every
                              # node runs the host driver with the same field
                              # names, so without this tag two machines write
                              # into one series and overwrite each other.


# ---------------------------------------------------------------------------
# Battery
#
# Only on nodes that read battery state. It describes the bank, not a device.
# ---------------------------------------------------------------------------

battery:
  bank_capacity_ah: 520
  nominal_volts: 12

  # Whether the monitored packs may stand in for the whole bank. Only some
  # packs report anything, so this is an assumption either way; state it here
  # rather than burying it in code.
  monitored_represents_bank: true

  packs:
    - {name: smart_pack, capacity_ah: 320, bms_amps: 200, monitored: true}
    - {name: pack_a,     capacity_ah: 100, bms_amps: 100, monitored: false}
    - {name: pack_b,     capacity_ah: 100, bms_amps: 100, monitored: false}

  # Where state of charge comes from, in priority order. The first source with
  # a reading newer than stale_after wins.
  #
  #   corrected  the project's own figure: the shunt integrated, but
  #              resynchronized to full on a detected full event
  #   bms        whatever the smart pack reports
  #   shunt_raw  the shunt's own figure, kept for comparison, not for control
  soc_sources: [corrected, bms]
  stale_after: 10m

  # Self-heating packs corrupt a coulomb counter: while charging in the cold,
  # heater current passes through the shunt and is counted as charge entering
  # the battery when it actually left as heat. The shunt therefore reads high
  # in exactly the season when accuracy matters. The fix is to resynchronize
  # on a full event detected WITHOUT the shunt.
  resync_on_full: true
  full_when:
    charge_state_in: [float]
    bms_reports_full: true


# ---------------------------------------------------------------------------
# Devices
#
#   mode: poll        telegraf inputs.exec runs every device of this mode in
#                     ONE process per interval. Stateless reads only.
#   mode: resident    telegraf inputs.execd holds it open. For things that
#                     stream or count: a rain gauge, unprompted serial frames.
#   mode: controller  the controller opens this device and publishes its
#                     readings. Telegraf never touches it. Use this for any
#                     device that admits a single reader on a node that also
#                     runs control, otherwise the controller and telegraf
#                     fight over the port and the control loop loses.
# ---------------------------------------------------------------------------

# Two ways to turn something off, and they mean different things:
#
#   absent          this machine does not have that device. Nothing to say
#                   about it. Irrigation on a sensors-only node is this case,
#                   and so is the whole control block there.
#   enabled: false  the device exists and is declared, but is out of service.
#                   Pins, ids and calibration are kept, so re-enabling is a
#                   one word change. A disabled device publishes enabled=0.0
#                   and nothing else, every interval.
#
# That last part matters: every declared device publishes something every
# interval, so SILENCE ALWAYS MEANS FAILURE, never intent.

devices:

  - name: box                 # becomes part of the log line, not a tag
    driver: dht
    mode: poll
    interval: 30s
    enabled: true             # the default; shown here for the example
    tags:
      location: box           # tags are per device, merged over the node tags
    params:
      model: DHT22            # DHT11, DHT22 or AM2302; informational only
      pin: 4                  # documentation: the overlay binds the sensor,
                              # and the driver finds it on the industrial I/O
                              # bus rather than by pin
      retries: 3              # a single failed reading is routine for these
                              # sensors, not exceptional
      # Needs a boot configuration line and a reboot:
      #     dtoverlay=dht11,gpiopin=4
      # The overlay is named dht11 whatever sensor is attached.
      #
      # Optional, and rarely needed:
      # iio_device: "iio:device0"   # when more than one DHT is present
      # max_humidity: 100.0         # implausible readings are retried rather
      # max_temp_f: 160.0           # than published, because the sensor's
      # min_temp_f: -40.0           # checksum cannot catch a wrong value
    calibration:
      temp: {scale: 1.0, offset: 0.0}
      humidity: {scale: 1.0, offset: 0.0}

  - name: outdoor_temp
    driver: ds18b20
    mode: poll
    interval: 30s
    tags: {location: outdoor}
    params:
      device_id: 28-000000000000   # the 1-Wire id, never a bus position

  - name: rain
    driver: rain_gauge
    mode: resident            # must be resident: it counts edges that arrive
                              # at unpredictable times
    tags: {location: outdoor}
    params:
      pin: 6
      bounce_ms: 1
      inches_per_tip: 0.011
      state_file: /var/lib/monitoring/example-rain.json
                              # the total lives only in memory otherwise and
                              # silently resets on every power event

  - name: mppt
    driver: vedirect
    mode: controller          # single-reader device on a controlling node
    tags: {location: solar}
    params:
      # Always the by-id path. /dev/ttyUSB0 numbering moves between boots.
      # Note this path contains the CABLE's serial number, so a replacement
      # cable changes it.
      port: /dev/serial/by-id/usb-VictronEnergy_BV_VE_Direct_cable_XXXXXXXX-if00-port0
      baud: 19200
      emit_every: 30s         # frames arrive about once a second; publish at
                              # this rate rather than storing 30x the data

  - name: bms
    driver: ble_bms
    mode: controller
    tags: {location: battery}
    params:
      address: "AA:BB:CC:DD:EE:FF"
      protocol: grenergy
      poll_every: 60s
      # Connect, read, disconnect. These modules accept one connection at a
      # time, so holding it open locks the vendor phone app out of the battery
      # while standing next to it.
      hold_connection: false
      timeout: 40s            # a cold BLE connect routinely takes 10 to 40s

  - name: shunt
    driver: ble_shunt
    mode: controller
    tags: {location: battery}
    params:
      address: "AA:BB:CC:DD:EE:FF"
      poll_every: 30s
      hold_connection: false
      timeout: 40s
      # Positive current means charging. Verify against reality before
      # trusting any derived load figure: the sign depends on which way the
      # shunt was wired.
      charge_is_positive: true

  - name: host
    driver: host
    mode: poll
    interval: 30s
    tags: {location: pi}


# ---------------------------------------------------------------------------
# Control
#
# Omit this whole block on a node that only collects. The controller is a
# separate systemd unit, not a telegraf input, and it reads only devices
# attached to this machine: load shedding that needs a network fails exactly
# when the power is failing.
# ---------------------------------------------------------------------------

  # An ABC-BMS pack, read over Bluetooth. Disabled here because the example
  # is never deployed, but declared because the battery heating block below
  # names it, and a control reference that resolves to nothing produces a load
  # that never runs with nothing reporting why.
  - name: pack1
    driver: abc_bms
    mode: poll
    enabled: false
    tags: {location: rack}
    params:
      address: "XX:XX:XX:XX:XX:XX"
      timeout: 40             # a cold Bluetooth connect genuinely takes this
      settle: 2.0             # quiet gap that marks the end of a reply

  - name: pack2
    driver: abc_bms
    mode: poll
    enabled: false
    tags: {location: rack}
    params: {address: "YY:YY:YY:YY:YY:YY"}

control:
  enabled: false              # default off. A node switches loads only when
                              # this is deliberately turned on.

  state_file: /var/lib/monitoring/example-control.json
                              # lockouts, counters, cooldowns and the last
                              # full-charge timestamp. The controller discards
                              # in-memory state on restart by design, so
                              # anything that must brake a restart loop has to
                              # live here.
  loop_interval: 10s
  publish_as:
    location: control         # where decisions and readbacks are published

  clock:
    # The Pi has no real-time clock. After a power cut it boots with whatever
    # fake-hwclock saved, which can be days wrong, so a schedule would fire at
    # the wrong time.
    require_sync_for_schedule: true
    mode_when_unsynced: full  # err toward running, not toward shedding

  loads:

    # -- DC branch: cameras and recorder ------------------------------------
    cameras:
      type: dc_branch
      enabled: true           # same meaning as on a device: false keeps the
                              # configuration but takes the load out of
                              # service, and says so on the dashboard
      control_pin: 23

      # Verifying what the hardware actually did is OPTIONAL. Three sources:
      #
      #   load   infer from measured DC load. Free, because the shunt is
      #          already there and the loads differ by orders of magnitude:
      #          cameras a couple of amps, inverter idle one or two, pump
      #          around 130. Cannot see a welded contactor masked by another
      #          load, and goes blind when the shunt reading is stale.
      #   pin    a dry contact on a GPIO: a contactor auxiliary block, or an
      #          AC current switch, which is better because it reports that
      #          current is really flowing rather than that an armature moved.
      #          Truly independent, costs hardware.
      #   none   no verification. Still safe, because the restart behaviour
      #          comes from the polarity rather than from a sensor.
      #
      # Do NOT press a spare power pole into service as a readback. Power
      # contacts switching milliamps grow an oxide film and start failing
      # intermittently months later.
      readback:
        source: load
        pin: null             # only when source is pin
        expect_amps: {min: 1.5, max: 6.0}   # only when source is load

      # energize_to_shed means NORMALLY CLOSED contacts: the load runs unless
      # the Pi deliberately opens them.
      #
      # This is the opposite of the irrigation polarity, deliberately. The
      # Pi supplies policy and the battery BMS is the hardware backstop, so a
      # failed Pi should leave the site behaving as it does today rather than
      # dark. With energize_to_connect, camera uptime would become a function
      # of Pi uptime: every restart, watchdog kill and deploy would cut the
      # recorder. The cost is coil power while shedding, which is a few watts
      # against the load being shed.
      polarity: energize_to_shed

      # What to do when state of charge is unknown. Never stop something on
      # ignorance; the voltage floor below still protects the bank, and it
      # comes over a wire rather than over Bluetooth.
      on_stale_data: permit

      # How several conditions combine, which is the same rule everywhere in
      # this project:
      #
      #   ANY single condition is enough to turn a load OFF.
      #   ALL conditions must agree to turn a load ON.
      #
      # The asymmetry is deliberate, because the two measurements fail in
      # opposite directions. State of charge drifts HIGH, which is the
      # self-heating problem, so alone it would under-protect; voltage catches
      # what it misses. Voltage sags transiently under load, so alone it would
      # shed early, which is the safe direction and is handled by the dwell
      # rather than by acting on one sample.
      #
      # A condition with no fresh reading is DROPPED from the test, never
      # counted as false. Otherwise one stale Bluetooth reading would mean the
      # restore test can never pass and the cameras stay off forever. When
      # every term is stale, on_stale_data decides.
      shed:
        shed_if_any:
          soc_below_pct: 12
          volts_below: 12.4   # loaded volts. LiFePO4 is nearly flat from
                              # about 15 to 95 percent, so voltage is useful
                              # only near the bottom
        restore_if_all:
          soc_above_pct: 25
          volts_above: 12.9   # a resting bank reads higher than a loaded one,
                              # so this is deliberately well clear of the floor
        shed_dwell: 5m        # the condition must hold this long
        restore_dwell: 15m    # longer, because recovery is easier to fake
        min_off: 30m          # no chatter around the threshold

      conservation:
        enabled: false
        window: {from: "00:00", to: "04:00"}
        enter_below_soc_pct: 40
        exit_above_soc_pct: 60

    # -- Sequenced AC: inverter and pump ------------------------------------
    irrigation:
      type: sequenced_ac
      enabled: true           # the seasonal off switch. Set false when the
                              # creek is dry; this is the manual dry-run
                              # protection, and it is visible rather than
                              # inferred from nothing happening
      on_stale_data: deny     # never start something on ignorance

      inverter:
        control_pin: 25
        polarity: energize_to_connect
        settle_after_on: 10s  # let the inverter stabilize before any load
        # Worth having in some form, because the relay is wired in parallel
        # with the inverter's own panel switch, so the Pi cannot command it off
        # while that switch is on. Derived from load, a standing idle draw
        # while commanded off reveals exactly that, which is the drain this
        # whole design exists to remove.
        #
        # As a pin this is not an auxiliary contact: it senses whether AC is
        # really present. A small pilot relay with a 120 VAC coil across the
        # output, dry contacts to the GPIO. Mains never reaches a GPIO pin.
        readback:
          source: load
          pin: null
          expect_amps: {min: 0.8, max: 3.0}

      pump:
        control_pin: 22
        polarity: energize_to_connect
        settle_before_inverter_off: 3s
        readback:
          source: load
          pin: null
          expect_amps: {min: 90, max: 180}

      # Where a request comes from. A decision may not depend on the network,
      # but a request is not a decision: the file is read locally like any
      # other input.
      schedule:
        - {days: [mon, wed, fri], at: "18:30", duration: 45m}
      request_file: /var/lib/monitoring/example-irrigation-request.json
      request_max_age: 2h     # a forgotten manual request must expire

      start_conditions:
        # Charge state is drift-free, unlike any coulomb counter. But the
        # Victron reports off or bulk after sunset however full the bank is,
        # so requiring it RIGHT NOW would make evening watering impossible.
        # "Was full within the window" keeps the drift-free property and
        # allows an evening run.
        charge_state_was_in: [float, absorption]
        within: 6h
        soc_above_pct: 40
        battery_volts_above: 13.0   # checked at the moment of starting: a
                                    # sagging bank plus motor inrush is how an
                                    # inverter trips mid-start

        # Deliberately NOT a production threshold. In float the charge
        # controller curtails, so production falls to whatever the loads draw.
        # A PV-watts gate would therefore fail hardest on the sunniest day.

      continue_conditions:
        # Separate from the start conditions on purpose. The pump itself
        # changes the conditions that allowed it to start: at 130 A the bank
        # sags and the controller leaves float within seconds, so re-checking
        # the start conditions would stop every cycle it began.
        max_run: 45m
        soc_above_pct: 30
        battery_volts_above: 12.6

      limits:
        cooldown: 2h
        max_amp_hours_per_day: 160
        failed_start_lockout: 3     # consecutive failed starts before giving
                                    # up for the day. This is what brakes the
                                    # loop where a converter brownout during
                                    # inrush reboots the Pi, the bank recovers
                                    # unloaded, and the criteria pass again
                                    # immediately.
        lockout_until: next_day

      dry_run_check:
        # A centrifugal pump running dry draws noticeably LESS current than a
        # loaded one, so the current step at start says whether it is really
        # pumping. Catches a dry creek, a seized pump, an airlock, a tripped
        # breaker. Real dry protection is still manual: disable irrigation
        # when the creek is dry.
        enabled: true
        expected_delta_amps: {min: 90, max: 180}   # measure, do not guess
        settle: 15s
        on_stale_shunt: skip        # skip | abort. Refusing to irrigate on a
                                    # stale Bluetooth reading would mean a
                                    # flaky radio stops the watering.

      guard:
        # A separate systemd unit that stops the controller when the pump has
        # run too long. Stopping releases the output pins, which drops the
        # contactor. The cap is deliberately longer than max_run so the two
        # limits do not share a failure mode.
        absolute_max_run: 60m

        # What the guard watches:
        #
        #   state_file  the file the controller rewrites each loop. Catches a
        #               hung controller and a controller that is simply wrong,
        #               which is what the guard is for. Cannot see a welded
        #               contactor. Needs no hardware.
        #   pin         a dry contact. Fully independent of the controller.
        input: state_file
        pin: null
        stale_after: 60s      # state file older than this counts as hung

    # -- Battery heating ----------------------------------------------------
    #
    # Optional. For packs with no heater of their own, which cannot be charged
    # below freezing. The pack's own BMS already refuses charge when it is too
    # cold, so this does not protect the battery: it exists to let a winter
    # day's sun actually reach the cells instead of being refused.
    #
    # The crude version of this is a heater on a low-voltage disconnect, which
    # heats whenever something is charging. It works. Driving it from measured
    # pack temperature is better because it heats only when heat is the thing
    # standing in the way.
    battery_heating:
      type: battery_heating
      enabled: false          # off until the heater and its relay are wired
      control_pin: 24

      # Energize to heat, the opposite of the camera branch and for the
      # opposite reason. A dead Pi that leaves cameras running costs a flat
      # battery, which the BMS bounds. A dead Pi that leaves a heater running
      # against a battery has no such bound.
      polarity: energize_to_connect

      # What to do with no temperature. Unlike the pump, where acting on
      # ignorance destroys a pump, heating on ignorance only reproduces the
      # dumb heater this replaces: heat whenever the sun is charging. That ran
      # for seasons without harm, and a mechanical over-temperature cutout in
      # series bounds the worst case.
      #
      # So refusing is the wrong default here. Refusing would mean a flaky
      # radio costs a whole winter of charging, which is worse than today.
      #   fallback  try the fallback sources, then heat on production alone
      #   deny      refuse. Correct only with no over-temperature cutout.
      on_stale_data: fallback

      temperature:
        # Which readings to believe, coldest first. The COLDEST sensor
        # governs, because the coldest pack is the one refusing charge and
        # warming the average does not help it.
        #
        # Prefer a wired sensor on the pack case over the BMS reading. Not
        # because the BMS is wrong, but because a Bluetooth pack answers every
        # few minutes and a one-wire probe answers in a second, and a control
        # loop should not wait on a radio. Keep the BMS reading as a
        # cross-check: two sensors disagreeing by a lot means one has fallen
        # off the case.
        # The packs' own sensors, about two per pack. Prefer these over any
        # probe stuck to a case: they sit against the cells, which is what
        # actually refuses charge, and they need no wiring.
        #
        # A radio that answers every few minutes is fast enough here, because
        # the thermal loop below is slower than that. This would be the wrong
        # choice for anything that has to react in seconds.
        sources:
          - {device: pack1, field: temp_1}
          - {device: pack1, field: temp_2}
          - {device: pack2, field: temp_1}
          - {device: pack2, field: temp_2}

        # Used only when every source above is stale. Ambient is not pack
        # temperature, but a cold room means cold packs, and it is a far better
        # guess than heating regardless of the weather.
        fallback_sources:
          - {device: box, field: temp}

        max_disagreement_f: 15      # warn, do not act, when they diverge
        stale_after: 10m

      # Wide deadband on purpose. The loop is slow: heat tape warms a case,
      # the case warms cells through their own thermal mass, and nothing moves
      # in seconds. Narrow thresholds would chatter and achieve nothing.
      heat_if_all:
        coldest_below_f: 41.0       # 5 C, so about 5 degrees above freezing
      stop_if_any:
        coldest_above_f: 50.0       # 10 C, comfortably charging
        any_sensor_above_f: 104.0   # 40 C. A hard stop, not a target.
      heat_dwell: 5m
      stop_dwell: 5m
      min_off: 15m

      # Heat only when the sun can pay for it. A heater is a large load, and
      # heating at night warms a pack with nothing to charge it.
      #
      # Do NOT gate this on charge current. A pack too cold to charge accepts
      # nothing, so charge current is zero exactly when heating is needed, and
      # the condition could never become true. Gate on what the panels are
      # producing, which is measured before the battery has any say.
      require_production:
        enabled: true
        # Panel VOLTAGE, not watts. Watts is the trap: when the pack is too
        # cold the BMS refuses charge, the controller curtails, and production
        # falls to whatever the loads draw. A watts gate would therefore read
        # low on exactly the cold clear morning this exists for, and the
        # heater would never start. This file already says so about the
        # irrigation gate; the same physics applies here.
        #
        # Panel voltage is set by sunlight and the panel, and the battery
        # cannot suppress it. An array well above battery voltage means the
        # sun is there whether or not anything is being charged.
        source: {device: mppt, field: pv_volts}
        above_volts: 80             # well above a dark array, well below the
                                    # open-circuit rating. Measure and adjust.
        stale_after: 10m

      limits:
        max_run_per_day: 6h
        cooldown: 15m

      readback:
        # A heater that is commanded on and draws nothing has failed, and in
        # winter that failure is silent until the charging never starts.
        source: none
        pin: null

      # The heater here is mains, run from the inverter, so the Pi switches a
      # relay that switches the outlet. Keep any existing low-voltage
      # disconnect in the circuit as a backstop, and put a mechanical
      # over-temperature cutout in series with the heater. Software must not
      # be the only thing between a heater and a battery.
