# Deer blind, upstairs Pi: sensors and two fans.
#
# Raspberry Pi Zero 2 W, Debian 12. Pin assignments match what is already
# wired; this file documents the existing installation rather than proposing
# a change to it.

site: blind1
node: upstairs
measurement: blind1
tags:
  node: upstairs

devices:

  # Read through the kernel's own driver rather than by bit-banging the pin
  # from Python, so the microsecond timing is protected from the scheduler.
  # Needs this in /boot/firmware/config.txt, and a reboot:
  #
  #     dtoverlay=dht11,gpiopin=17
  #
  # The overlay is called dht11 whatever sensor is attached. A DHT22 uses the
  # same line, which is the commonest reason people think it is unsupported.
  #
  # The overlay is what binds the sensor, and the driver finds it on the
  # industrial I/O bus. The pin here must match gpiopin in the overlay: the
  # driver refuses a sensor the kernel reports on any other pin.
  - name: box
    driver: dht
    mode: poll
    interval: 30s
    tags: {location: pi}
    params:
      model: DHT11
      pin: 17
      retries: 3

  - name: outdoor_temp
    driver: ds18b20
    mode: poll
    interval: 30s
    tags: {location: outdoor}
    params:
      device_id: 28-3ce1d44326bf

  # rain_inches counts up and is persisted across power events; it does not
  # reset to zero on a restart. A dashboard panel should therefore ask for
  # the increase over a window rather than expect the number itself to
  # return to zero.
  - name: rain
    driver: rain_gauge
    mode: resident
    tags: {location: outdoor}
    params:
      pin: 6
      bounce_ms: 1
      inches_per_tip: 0.011
      emit_every: 60s
      state_file: /var/lib/monitoring/blind1-rain.json

  # The charge controller lives here only until a second Pi exists downstairs.
  # Today it is reached through a USB extension spanning 8 to 9 feet, which is
  # a known source of intermittent enumeration failures; the downstairs node
  # will reach it with the supplied cable and no extension.
  #
  # Moving it later is cut and paste: this entry goes into downstairs.yaml
  # unchanged, mode included, because a device that streams is read by a
  # resident collector whether or not that node also controls loads. The
  # measurement and the location tag do not change either, so dashboards
  # filtering on those are unaffected. Only the node tag changes.
  - name: mppt
    driver: vedirect
    mode: resident
    tags: {location: solar}
    params:
      port: /dev/serial/by-id/usb-VictronEnergy_BV_VE_Direct_cable_VEAWO3NQ-if00-port0
      baud: 19200
      emit_every: 30s

  - name: host
    driver: host
    mode: poll
    interval: 30s
    tags: {location: pi}

# The PCF8591 analog-to-digital converter on GPIO2 and GPIO3 is deliberately
# absent. It exists only to measure battery voltage, which the charge
# controller reports more accurately on the downstairs node, and the two
# disagreed by about 0.3 V. Retiring it frees the I2C pins.

  # The load controller, read as though it were a device.
  #
  # The controller is a separate service, not a collector. What it decided
  # still has to reach the database, and this is how: the loop writes a small
  # document to tmpfs, this reads it, and telegraf's existing poll fragment
  # carries it like any other device. No second output path, no second set of
  # credentials, nothing new in the telegraf configuration.
  #
  # Enabled together with the control block, never separately. Enabled here with
  # the controller off, every poll fails with "the controller has published
  # nothing", which is true but is noise rather than news. Disabled here with
  # the controller on, the shed level and the reason code reach nobody, and a
  # controller that has stopped looks exactly like one that is content.
  - name: control
    driver: control
    mode: poll
    interval: 30s
    enabled: false
    params: {path: /run/monitoring/control.json}
    tags: {location: control}


# The vent fan. Control lives on this node because the fan, the inside sensor
# and the outside sensor are all here. A decision must not depend on the
# network, so a controller reads its own machine's sensors and nothing else.
#
# The relay is wired, and turning on control below is what puts the fan under
# this block's rules. With control off the relay stays released and the fan off.
control:
  enabled: false
  loop_interval: 30s

  # The four channel board here energizes a coil when its input is pulled
  # to ground. Its loads are fans, so a coil that pulled in while the Pi
  # boots would cost nothing. Wired as the downstairs board is anyway, with
  # the input side's VCC on the Pi's 3.3 V.
  relay_trigger: low
  loads:

    # A tiny fan, half an amp. This is the one load that needs no second relay
    # stage: half an amp on a contact printed 10 A is five percent of rating.
    vent_fan:
      type: vent_fan

      enabled: true
      control_pin: 26               # physical 37

      # Energize to run, so a dead Pi leaves the fan off.
      #
      # Opposite of the camera branch, and the difference is what each failure
      # costs. The cameras are normally closed because a recorder power cycled
      # on every Pi reboot is the real risk there. A fan does not care about
      # cycling at all. What a fan would cost, left stuck on, is half an amp
      # through a winter night, which is 12 Ah a day taken from the bank in
      # the season it can least afford it. Stuck off costs a warm blind in a
      # month with surplus sun.
      polarity: energize_to_connect

      # No temperature, no fan. The cost of refusing is a warm blind for an
      # afternoon, which is nothing like the cost of refusing to heat a
      # battery, so this one can simply decline.
      on_stale_data: deny

      inside: {device: box, field: temp}
      outside: {device: outdoor_temp, field: temp}
      stale_after: 10m

      # Two conditions, and the second is what makes this better than a timer.
      # A fan moving air that is warmer than the air it replaces heats the
      # building and spends power to do it. Running all summer gets this wrong
      # on every humid night.
      run_if_all:
        inside_above_f: 80.0
        outside_cooler_by_f: 10.0

      stop_if_any:
        inside_below_f: 77.0
        outside_cooler_by_less_than_f: 6.0

        # Optional, and null here on purpose. The batteries are downstairs, so
        # venting this space cannot chill them. Set a floor if that ever stops
        # being true, because cold air on a pack works against the charging.
        outside_below_f: null

      run_dwell: 2m
      stop_dwell: 5m
      min_run: 5m
      min_off: 5m

      # Deliberately no battery gate on this node, which is a change of mind
      # worth recording.
      #
      # Half an amp is not worth shedding, and this node cannot measure the
      # bank anyway. The only voltage here comes from the charge controller,
      # which is a resident device whose serial port a controller cannot
      # share, and which moves to the downstairs node as soon as that exists.
      # A gate naming it would stop working on the day of that move, and the
      # symptom would be a fan that never runs with nothing reporting why.
      #
      # If the fan ever wants one, it belongs on the node that measures the
      # battery.

      readback:
        source: none
        pin: null

    # A small 12 V fan aimed at the Pi, on a relay channel of its own. The
    # relay switches the battery's 12 V straight to the fan.
    cpu_fan:
      type: cpu_fan
      enabled: true
      control_pin: 24               # physical 18

      # Energize to run. A dead Pi needs no cooling, so the fan stays off.
      polarity: energize_to_connect

      # The chip temperature the host driver reads. A fan that has had a
      # reading and loses it runs: it costs a fraction of an amp, and a chip
      # nobody can see is the one that throttles. Before its first reading
      # after a boot it stays off, which is where the pin already is.
      source: {device: host, field: cpu_temp_f}
      stale_after: 2m

      # The firmware throttles hard at 185 F. On 20 F below that, off 20 F
      # below that, and between them the fan does what it last did. Some
      # boards in this family also step the clock down at 140 F; run
      # `vcgencmd get_config temp_soft_limit` on the machine, and if it
      # answers 60, lower both bounds below 140.
      run_above_f: 165
      stop_below_f: 145
      min_run: 2m
      min_off: 2m
