# Resident devices on the deer blind's downstairs node.
#
# One stanza per device whose mode is "resident" in downstairs.yaml. A test
# asserts that this file and the node file agree, so a device added to one and
# forgotten in the other fails in CI rather than by quietly never reporting.
#
# The charge controller connects to this node directly, with no USB extension.
# It streams unprompted, so signal = "none": telegraf does not ask it for a
# reading, it reads whatever the child prints. telegraf restarts an execd child
# after restart_delay if it exits, which is the retry logic, so the driver does
# not implement one.
#
# Nothing here competes with load control. The control loop reads this device's
# published values from the reading cache rather than opening the port, which
# is why the port can be held by a collector that streams it continuously.

[[inputs.execd]]
  command = ["/opt/monitoring/bin/collect", "mppt",
             "--node", "/etc/monitoring/node.yaml", "--stream"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
