# Resident devices on the deer blind's upstairs node.
#
# One stanza per device whose mode is "resident" in upstairs.yaml. Hand
# written and committed rather than generated: three machines need a handful
# of stanzas between them, and a generator would be more code than its output.
# A test asserts that this file and the node file agree, so a device added to
# one and forgotten in the other fails in CI rather than by quietly never
# reporting.
#
# signal = "none" because these devices talk when they feel like it. telegraf
# does not ask them for a reading; it reads whatever the child prints.
#
# telegraf restarts an execd child after restart_delay if it exits, which is
# the retry logic, so the drivers do not implement one.

[[inputs.execd]]
  command = ["/opt/monitoring/bin/collect", "mppt",
             "--node", "/etc/monitoring/node.yaml", "--stream"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"

[[inputs.execd]]
  command = ["/opt/monitoring/bin/collect", "rain",
             "--node", "/etc/monitoring/node.yaml", "--stream"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
