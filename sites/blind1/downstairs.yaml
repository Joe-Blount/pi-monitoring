# Deer blind, downstairs Pi: power devices and load control.
#
# NOT BUILT YET. This machine does not exist. The file is here so the schema
# can be reviewed and so the design has somewhere concrete to live.
#
# Control is commissioned in place rather than on a bench, which is how
# everything else here was built. What makes that reasonable is that the
# run-time cap and the guard are in force from the first live run, so a relay
# that sticks on is bounded rather than unbounded. Have those working before
# the first live test.
#
# Two questions that a bench would have answered are software rather than
# hardware, and are settled remotely with nothing wired:
#
#   1. does killing a process actually release the GPIO line? That depends on
#      which gpiozero backend is installed, not on any relay, and the whole
#      fail-safe story rests on the answer being yes.
#   2. can two processes hold one input line? They cannot, under the GPIO
#      character device, which decides whether the guard needs its own pin.
#
# The third is genuinely hardware and is settled when the part is bought: a
# relay module that triggers on a LOW input carries its own pull-up, which
# beats the Pi's weak internal pull-down and energizes the relay during every
# boot. Buy active-high.
#
# Every threshold below is a placeholder until the loads are characterized.

site: blind1
node: downstairs
measurement: blind1
tags:
  node: downstairs


battery:
  bank_capacity_ah: 520
  nominal_volts: 12
  monitored_represents_bank: true     # checked repeatedly against the shunt:
                                      # state of charge and charge rate track
                                      # proportionally

  packs:
    - {name: chins320, capacity_ah: 320, bms_amps: 200, monitored: true}
    - {name: weize_a,  capacity_ah: 100, bms_amps: 100, monitored: false}
    - {name: weize_b,  capacity_ah: 100, bms_amps: 100, monitored: false}

  soc_sources: [corrected, bms]
  stale_after: 10m

  # All three packs self-heat, so heater current inflates the shunt's figure
  # while charging in the cold.
  resync_on_full: true
  full_when:
    charge_state_in: [float]
    bms_reports_full: true


devices:

  - name: mppt
    driver: vedirect
    mode: resident
    tags: {location: solar}
    params:
      port: /dev/serial/by-id/usb-VictronEnergy_BV_VE_Direct_cable_VEAWO3NQ-if00-port0
      baud: 19200
      emit_every: 30s
      # Connects directly on this node. The upstairs Pi needed a USB
      # extension to span 8 to 9 feet, which is a known source of
      # intermittent enumeration failures.

  # Disabled while the upstairs node polls this pack instead. These allow one
  # connection at a time, so two readers would take turns failing. Enable this
  # and remove the upstairs entry on the same visit, never separately.
  - name: bms
    driver: jbd
    enabled: false
    mode: poll
    tags: {location: battery}
    params:
      address: "A5:C2:37:4C:80:F7"    # chins320, read off the pack itself
      # A total budget for the whole exchange: scanning, connecting,
      # every command and the disconnect, not only the connect step. A
      # real read of this device takes about nine seconds, and the
      # node's slow devices together must fit the collector's 120
      # second timeout, counting five seconds of grace each.
      timeout: 40s
      settle: 2s                      # quiet gap that marks the end of a reply

  # Disabled while the upstairs node polls the shunt instead. It allows one
  # connection at a time, so two readers would take turns failing. Enable
  # this and remove the upstairs entry on the same visit, never separately.
  - name: shunt
    driver: qinglan
    mode: poll
    enabled: false
    tags: {location: battery}
    params:
      address: "C8:47:80:52:16:A9"
      device_address: 1               # part of every request
      # Connect, read and disconnect each time. The device allows one
      # connection at a time, so holding it locks the phone application out.
      timeout: 25s
      settle: 2s
      # Current is published signed, positive into the battery, the same
      # convention as the charge controller and both packs. The shunt
      # reports a magnitude and a direction separately and the driver
      # combines them, so nothing here needs a wiring-dependent setting.

  - name: host
    driver: host
    mode: poll
    interval: 30s
    tags: {location: pi}

  # The load controller, read as though it were a device.
  #
  # The controller is a separate service, not a collector. What it decided
  # still has to reach the database, and this is how: the loop writes a small
  # document to tmpfs, this reads it, and telegraf's existing poll fragment
  # carries it like any other device. No second output path, no second set of
  # credentials, nothing new in the telegraf configuration.
  #
  # Enabled together with the control block, never separately. Enabled here with
  # the controller off, every poll fails with "the controller has published
  # nothing", which is true but is noise rather than news. Disabled here with
  # the controller on, the shed level and the reason code reach nobody, and a
  # controller that has stopped looks exactly like one that is content.
  - name: control
    driver: control
    mode: poll
    interval: 30s
    enabled: false
    params: {path: /run/monitoring/control.json}
    tags: {location: control}


control:
  # Stays false until the bench rig passes, and it could not start before
  # then anyway: the ladder below reads the pack's own BMS, that device is
  # disabled here while the upstairs node polls it, and the control spec
  # refuses a source nothing will write a reading for. So the coupling the
  # device comments ask for by hand is enforced by code. Enabling control
  # without enabling the pack fails at start with the reason, rather than
  # running a controller that latches nothing and sheds nothing.
  enabled: false

  loop_interval: 10s
  clock:
    require_sync_for_schedule: true
    mode_when_unsynced: full

  loads:

    cameras:
      type: dc_branch
      enabled: true
      control_pin: 23                 # physical 16

      # Normally closed, so de-energized connects the load. A dead Pi, a lost
      # 12 V feed or a killed controller all leave the site watched, and a
      # reboot does not power cycle the recorder.
      #
      # The cost of this choice is the one to keep in view: shedding does
      # power cycle the recorder, once a day in the night tier and twice a
      # day in the window tier. The recorder and the cameras share this
      # branch, so there is no way to shed the cameras alone. Putting the
      # recorder on its own channel is a wire and a second load block, not a
      # redesign, if the cycling turns out to bother it.
      polarity: energize_to_shed

      min_run: 10m                    # a recorder should not be cycled
      min_off: 30m                    # repeatedly in either direction

      shed_ladder:
        # The battery alone. The shunt sees the whole bank and this pack's
        # BMS sees one pack of three, but the shunt's coulomb count drifts,
        # worst in the cold when all three packs self-heat and its figure is
        # inflated by heater current. The BMS also carries per-cell voltages,
        # which is what the floor below wants. The packs are in parallel, so
        # one pack's state of charge tracks the bank closely enough to decide
        # with, and the note on bank_capacity_ah above records that this was
        # checked rather than assumed.
        source: {device: bms, field: state_of_charge_pct}
        stale_after: 10m

        # Entry is counted in readings and release is timed, deliberately.
        # Entry guards against one glitched sample latching a tier whose
        # release is fifteen points away, which in winter is weeks, and a
        # count does that whatever rate the sensor arrives at. Release guards
        # against restoring on a charging spike, which lasts seconds however
        # many readings land inside it.
        enter_after_readings: 2
        restore_dwell: 15m
        release_margin_pct: 15

        # The one rule with nothing above it. It overrides every tier, every
        # schedule, the clock, an operator override and the minimum times,
        # and it needs no clock, so it keeps working on a machine that has no
        # idea what day it is.
        #
        # Two sources, in different units, each with its own bounds. The cell
        # minimum is the real floor: a pack voltage cannot see one weak cell,
        # since 3.10 V beside three at 3.43 reads as a healthy 13.39 V bank.
        # The charge controller's figure is the second opinion, because it is
        # wired, resident, and reports every thirty seconds while the BMS
        # radio goes quiet for minutes at a time.
        #
        # Either source may shed. Only the source that shed may release,
        # which is what stops the pack voltage clearing a floor the cell
        # tripped: shedding this branch removes most of the draw, so the pack
        # voltage rises as a direct result of the shed.
        floor:
          sources:
            - device: bms
              field: cell_min_volts
              shed_below: 3.15        # about 5 percent on this chemistry
              restore_above: 3.25     # about 10 percent
            - device: mppt
              field: battery_volts
              shed_below: 12.6
              restore_above: 13.0

        # Each tier is a complete schedule, and the load runs only while
        # every latched tier permits it. A deeper tier can then only remove
        # running time, so the ladder cannot ask for more power at a lower
        # state of charge however these windows are later edited.
        #
        # The ladder is keyed to what the cameras are for rather than to
        # clock convenience. Midday goes first because it is worthless for
        # deer, then the night, then everything. Cameras and recorder are
        # most of the steady draw here, so the remaining tiers are roughly
        # 1.3x, 2.8x and 6.7x the runway of running them continuously.
        tiers:
          - below_pct: 50
            schedule: {type: clock, on_from: "05:00", on_to: "22:00"}

          - below_pct: 25
            # The deer movement windows. Each is weighted toward the lit side
            # of its event, which is where a camera is useful and where legal
            # shooting light sits. They stay inside the tier above all year:
            # measured against an almanac for this latitude the margin is
            # nine minutes at dawn and seven at dusk, at the June extreme.
            schedule:
              type: solar
              on_windows:
                - {from: [sunrise, -1h], to: [sunrise, 2h]}
                - {from: [sunset, -2h], to: [sunset, 1h]}

          - below_pct: 10
            # Buys runway rather than safety. With this branch off, the Pi,
            # the charge controller and the battery radios still draw, and
            # none of that can be shed because one of them is doing the
            # shedding. The floor above and the pack's own cutoff are what
            # actually stop the discharge.
            schedule: {type: never}

    irrigation:
      type: sequenced_ac

      # Declared, specified, and not driven. The controller refuses an
      # enabled load of a type it does not drive, rather than skipping it at
      # run time: a file saying a load is on with nothing driving it reads
      # exactly like a load that works.
      #
      # Three reasons it waits. Every threshold below is a placeholder until
      # the pump is characterized. It is the only load here that can cause
      # physical damage, through a pump drawing 90 to 180 A behind an
      # inverter sequence. And it is seasonal, so nothing is lost by waiting.
      enabled: false
      on_stale_data: deny

      inverter:
        control_pin: 25               # physical 22, relay in parallel with
                                      # the inverter's own panel switch
        polarity: energize_to_connect
        settle_after_on: 10s
        readback:
          source: load                # a standing idle draw while commanded
                                      # off means the panel switch was left on
          pin: null
          expect_amps: {min: 0.8, max: 3.0}

      pump:
        control_pin: 22               # physical 15
        polarity: energize_to_connect
        settle_before_inverter_off: 3s
        readback:
          source: load
          pin: null
          expect_amps: {min: 90, max: 180}   # placeholder until characterized

      schedule: []                    # none yet; manual requests only at first
      request_file: /var/lib/monitoring/blind1-irrigation-request.json
      request_max_age: 2h

      start_conditions:
        charge_state_was_in: [float, absorption]
        within: 6h
        soc_above_pct: 40
        battery_volts_above: 13.0

      continue_conditions:
        max_run: 45m
        soc_above_pct: 30
        battery_volts_above: 12.6

      limits:
        cooldown: 2h
        max_amp_hours_per_day: 160    # about 31 percent of the bank
        failed_start_lockout: 3
        lockout_until: next_day

      dry_run_check:
        enabled: true
        expected_delta_amps: {min: 90, max: 180}   # placeholder until the
                                                   # load is characterized
        settle: 15s
        on_stale_shunt: skip

      guard:
        absolute_max_run: 60m
        input: state_file
        pin: null
        stale_after: 60s
