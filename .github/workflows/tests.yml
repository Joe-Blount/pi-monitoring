# Run the test suite on every push.
#
# The point is to catch a broken commit before it reaches a machine at the end
# of a dirt road, where fixing it means either a working overlay network or a
# drive.
#
# Linux runners only. They bill at the plain rate, where macOS bills at ten
# times that and Windows at twice, and nothing here is platform specific.
#
# One Python version per deployed release: 3.9 for Debian 11, 3.11 for
# Debian 12 and 3.13 for Debian 13. A change that only works on some of them
# is a change that breaks a site.
#
# Each runs in the official Python image for its version rather than on a
# Python installed onto the runner. The runner's image moves on its own
# schedule, and an installer that has no build for a version on it fails the
# job before a test runs. The full images carry git, which the suite uses to
# list tracked files.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    container: python:${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      # The checkout belongs to the runner's user and the container runs as
      # root. actions/checkout trusts the directory only for its own git
      # calls, in a temporary config, so after it git refuses the directory
      # and the tests that list tracked files skip rather than run.
      - name: trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install
        run: python -m pip install -e ".[dev]"

      # -rs prints the reason for each skip, so a test that skips here and
      # runs on a laptop is visible in the log.
      - name: tests
        run: python -m pytest -q -rs

      - name: every committed node file is valid
        run: |
          for node in sites/*/*.yaml; do
            echo "== $node"
            python bin/collect --node "$node" --list
          done
