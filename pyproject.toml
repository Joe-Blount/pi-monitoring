[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-monitoring"
version = "0.1.0"
description = "Device drivers and per-node configuration for off-grid solar monitoring"
# Targets 3.9 because one of the deployed machines runs Raspbian 11. That
# rules out tomllib, which is why configuration is YAML.
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "gpiozero>=2"]   # gpiozero for its mock pin factory

[tool.setuptools.packages.find]
include = ["monitoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
