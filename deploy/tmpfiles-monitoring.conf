# Creates the tmpfs directories the collectors and the load controller
# share. See monitoring/control/files.py for why this state lives on
# tmpfs at all (readings and loop state must never touch the SD card) and
# why it is split from /var/lib/monitoring, which install.sh sets up
# instead because it has to survive a reboot.
#
# /run is wiped at every boot, so these directories do not exist until
# something creates them, and systemd runs this file's entries, as root, via
# systemd-tmpfiles-setup.service before any other service starts -- see the
# After= line in deploy/monitoring-control.service for the ordering that
# depends on it.
#
# Owned telegraf:telegraf rather than left to whichever process gets there
# first. The collectors (started by telegraf.service, running as the
# telegraf user) and the controller (monitoring-control.service, also
# User=telegraf) are the only two things that ever touch this path, and
# both are the same Unix user, so there is nothing to reconcile between
# them -- except for whoever creates the directory before either of them
# gets a chance to. If that is a hand run as root, testing the collector
# binary directly, say, the directory comes out root-owned, and telegraf can
# never write to it again until the next reboot clears /run. Because the
# `d` type below fixes the owner and mode on a path that already exists, not
# only one that is missing, running `systemd-tmpfiles --create` by hand
# repairs that without even waiting for a reboot.
#
# Mode 0750, not 0755: the per-device readings and the loop's own state are
# the only data in this project not already meant for anyone to see --
# battery voltages, cell minimums, which load is live and which is shed --
# and nothing outside the telegraf user needs to read any of it.
d /run/monitoring 0750 telegraf telegraf -
d /run/monitoring/readings 0750 telegraf telegraf -
