# Poll-mode devices for this node.
#
# One exec input for the whole node, not one per device. Several separate exec
# inputs all fire on the same tick with round_interval on, which starts several
# Python interpreters at once on a single-board computer. A bit-banged sensor
# being read at that moment is the one that loses.
#
# The timeout is deliberately well above telegraf's 5 second default: a
# temperature sensor with retries can take several seconds on a busy machine,
# and a timeout looks exactly like a dead sensor in the logs.
#
# This file adds an input only. It never touches the output, so an existing
# InfluxDB configuration on this machine is left alone.

[[inputs.exec]]
  commands = ["/opt/monitoring/bin/collect --node /etc/monitoring/node.yaml --poll"]
  # This governs how often every poll device on this node is read. The
  # per-device interval in a node file does not: telegraf schedules the one
  # command, not the devices inside it.
  interval = "30s"
  timeout = "20s"
  data_format = "influx"

  # Without this, telegraf discards the command's stderr whenever the exit
  # code is zero, which is the normal case when one device fails and the
  # others succeed. A dead sensor would then produce no point and no log line
  # anywhere, which is the exact silence this project exists to prevent.
  log_stderr = true
