# Poll-mode devices for this node.
#
# One exec input for the whole node, not one per device. Several separate exec
# inputs all fire on the same tick with round_interval on, which starts several
# Python interpreters at once on a single-board computer. A bit-banged sensor
# being read at that moment is the one that loses.
#
# The timeout is deliberately well above telegraf's 5 second default: a
# temperature sensor with retries can take several seconds on a busy machine,
# and a timeout looks exactly like a dead sensor in the logs.
#
# This reads the FAST devices only. Anything whose single read can take tens
# of seconds, which today means Bluetooth, is collected by a separate input
# with its own interval and a far longer timeout. Sharing one would mean an
# unreachable battery holding this process until telegraf killed it, and the
# kill would discard every reading already taken, including the points that
# exist to report the failure.
#
# This file adds an input only. It never touches the output, so an existing
# InfluxDB configuration on this machine is left alone.

[[inputs.exec]]
  commands = ["/opt/monitoring/bin/collect --node /etc/monitoring/node.yaml --poll --speed fast"]
  # This governs how often every poll device on this node is read. The
  # per-device interval in a node file does not: telegraf schedules the one
  # command, not the devices inside it.
  interval = "30s"
  timeout = "20s"
  data_format = "influx"

  # Without this, telegraf discards the command's stderr whenever the exit
  # code is zero, which is the normal case when one device fails and the
  # others succeed. A dead sensor would then produce no point and no log line
  # anywhere, which is the exact silence this project exists to prevent.

  # NOTE: do not add log_stderr here. It is not a valid inputs.exec option,
  # and telegraf treats an unknown field as a fatal configuration error: it
  # refuses to start at all, taking every other input on the machine down with
  # it. That is how this file once stopped a working node.
  #
  # What it was reaching for: telegraf discards a command's stderr when the
  # exit code is zero, which is the normal case here, because the collector
  # exits zero whenever it wrote anything at all. So a per-device failure
  # reason may not reach the journal.
  #
  # That is acceptable, because stderr was never the primary channel. A failed
  # device still publishes a point carrying ok=0.0 and error_message, which
  # reaches the dashboard and survives a log rotation. Run the collector by
  # hand to see the reasons.
