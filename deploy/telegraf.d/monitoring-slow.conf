# Slow poll devices for this node, which today means Bluetooth batteries.
#
# Installed only when the node declares one. A node with nothing slow on it
# does not get this file.
#
# Why these are not in the main poll input:
#
# Poll devices share one process and one timeout. A cold Bluetooth connect
# alone takes 10 to 40 seconds, and a pack that is out of range, asleep, or
# held by a phone takes the full timeout and returns nothing. Sharing the fast
# input would mean telegraf killing that process every cycle, and a kill
# discards every reading taken before it, including the points whose whole
# purpose is to report the failure. One unreachable battery would silence the
# entire node.
#
# The interval is also the real answer to "how often is a pack read". A node
# file's per-device interval does not schedule anything in poll mode; telegraf
# schedules the command. These packs allow one connection at a time, so every
# read locks the owner's phone application out for as long as it lasts, which
# is why the interval is minutes rather than seconds.
#
# Read one after another, not together, and that is a deliberate refusal.
#
# Reading them together is supported, by passing --concurrent, and it would
# halve the spread between the two battery readings. What stopped it being
# enabled here is that these drivers hand an address to bleak, and bleak
# resolves an address it has not cached by discovering it, so two reads
# starting at once can mean two overlapping discoveries on one radio. Bleak's
# own documentation warns that concurrent connection attempts cause
# connection problems. The cost of being wrong is the battery readings this
# whole system exists to take, replaced by connection failures, on machines
# nobody is standing next to.
#
# It is worth trying, with somebody present and the radio watched:
#
#   collect --node /etc/monitoring/node.yaml --poll --speed slow --concurrent
#
# run by hand a few times against the real packs. If it is reliable there,
# add --concurrent to the command below and the readings tighten up.
#
# The interval below is three minutes, which is safe sequentially: the device
# timeouts sum to about seventy-five seconds against the two minute limit
# beneath them.

[[inputs.exec]]
  commands = ["/opt/monitoring/bin/collect --node /etc/monitoring/node.yaml --poll --speed slow"]
  interval = "180s"

  # Long enough for several packs, each of which may spend most of a minute
  # failing to connect. Still finite: a hung radio must not wedge the input.
  timeout = "120s"
  data_format = "influx"

  # NOTE: do not add log_stderr here. It is not a valid inputs.exec option,
  # and telegraf treats an unknown field as a fatal configuration error: it
  # refuses to start at all, taking every other input on the machine down with
  # it. That is how this file once stopped a working node.
  #
  # What it was reaching for: telegraf discards a command's stderr when the
  # exit code is zero, which is the normal case here, because the collector
  # exits zero whenever it wrote anything at all. So a per-device failure
  # reason may not reach the journal.
  #
  # That is acceptable, because stderr was never the primary channel. A failed
  # device still publishes a point carrying ok=0.0 and error_message, which
  # reaches the dashboard and survives a log rotation. Run the collector by
  # hand to see the reasons.
